name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (decode binary assets stored as base64 text)
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_b64 --exclude=./_site -cf - . | tar -xf - -C _site
          cd _b64
          find . -name '*.b64' | while read -r f; do
            out="../_site/${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
          done
          cd ..
          test -s _site/og.png && test -s _site/index.html
          find _site -type f | sort
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
